name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS Production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Display Deployment Context
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "=================================================="
          echo "🚀 INITIATING PRODUCTION DEPLOYMENT"
          echo "=================================================="
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "Triggered  : ${{ github.event_name }}"
          echo "Target Host: ${SSH_HOST}"
          echo "Target URL : https://hophuloc.online"
          echo "=================================================="

      - name: 🛡️ Validate Required Deployment Secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          MISSING=0
          if [ -z "${SSH_HOST}" ]; then
            echo "❌ ERROR: Missing required GitHub Secret: SSH_HOST"
            MISSING=1
          fi
          if [ -z "${SSH_PORT}" ]; then
            echo "❌ ERROR: Missing required GitHub Secret: SSH_PORT"
            MISSING=1
          fi
          if [ -z "${SSH_USER}" ]; then
            echo "❌ ERROR: Missing required GitHub Secret: SSH_USER"
            MISSING=1
          fi
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "❌ ERROR: Missing required GitHub Secret: SSH_PRIVATE_KEY"
            MISSING=1
          fi

          if [ $MISSING -ne 0 ]; then
            echo "💡 Please ensure all 4 secrets (SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY) are configured in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "✅ All required deployment secrets are validated."

      - name: 🔑 Configure SSH Authentication
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Load private key into SSH agent without displaying key in logs
          eval "$(ssh-agent -s)"
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null

          # Add target host to known_hosts to prevent interactive prompt
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          # Persist SSH agent socket across sub-steps
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: 🚀 Execute Remote Deployment via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          echo "🌐 Connecting to VPS [${SSH_USER}@${SSH_HOST}:${SSH_PORT}]..."

          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "bash -s" << 'EOF'
            set -eo pipefail

            APP_DIR="/var/www/app-chi-tieu"
            COMPOSE_FILE="docker-compose.prod.yml"

            echo "=================================================="
            echo "📂 Changing working directory to ${APP_DIR}..."
            echo "=================================================="
            cd "${APP_DIR}" || {
              echo "❌ ERROR: Directory ${APP_DIR} does not exist on VPS!"
              exit 1
            }

            PREV_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
            echo "📌 Current commit on VPS before deployment: ${PREV_COMMIT}"

            echo "📥 Fetching latest commits from origin/main..."
            git fetch origin main

            echo "🔄 Resetting working tree to match origin/main (preserving .env)..."
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse --short HEAD)
            echo "✅ VPS is now updated to target commit: ${NEW_COMMIT}"

            if [ ! -f .env ]; then
              echo "⚠️ WARNING: .env file was not found! Generating default from .env.example..."
              cp .env.example .env
            fi

            echo "🐳 Building Docker production containers with fresh code..."
            docker compose -f "${COMPOSE_FILE}" build --pull

            echo "🗄️ Executing Prisma Database Migrations on VPS..."
            docker compose -f "${COMPOSE_FILE}" run --rm app npx prisma migrate deploy

            echo "🚀 Launching production containers (zero-downtime recreation)..."
            docker compose -f "${COMPOSE_FILE}" up -d --remove-orphans

            echo "🧹 Pruning old dangling Docker images..."
            docker image prune -f

            echo "📊 Verifying production container status..."
            docker compose -f "${COMPOSE_FILE}" ps

            echo "=================================================="
            echo "✅ VPS Remote Deployment Steps Finished!"
            echo "=================================================="
          EOF

      - name: 🩺 Verify Production Readiness Probe (Health Check)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          TARGET_READY_URL="https://hophuloc.online/health/ready"
          TARGET_LIVE_URL="https://hophuloc.online/health/live"

          echo "=================================================="
          echo "🩺 VERIFYING PRODUCTION HEALTH & READINESS"
          echo "Target URL: ${TARGET_READY_URL}"
          echo "=================================================="

          MAX_RETRIES=12
          DELAY_SECONDS=5
          HEALTHY=0

          for ((i=1; i<=MAX_RETRIES; i++)); do
            HTTP_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 10 "${TARGET_READY_URL}" || echo "000")
            echo "⏳ [Attempt $i/$MAX_RETRIES] Probing ${TARGET_READY_URL} -> HTTP ${HTTP_CODE}"

            if [ "${HTTP_CODE}" = "200" ]; then
              echo "✅ Health check PASSED (HTTP 200 OK)!"
              HEALTHY=1
              break
            fi

            if [ $i -lt $MAX_RETRIES ]; then
              sleep ${DELAY_SECONDS}
            fi
          done

          if [ $HEALTHY -ne 1 ]; then
            echo "❌ CRITICAL: Production health probe FAILED at ${TARGET_READY_URL} after $((MAX_RETRIES * DELAY_SECONDS))s!"
            echo "📋 Fetching remote container diagnostics via SSH..."

            ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "bash -s" << 'EOF' || true
              cd /var/www/app-chi-tieu
              echo "--- Docker Compose Container Status ---"
              docker compose -f docker-compose.prod.yml ps
              echo "--- App Container Recent Logs ---"
              docker compose -f docker-compose.prod.yml logs --tail=50 app
              echo "--- Nginx Container Recent Logs ---"
              docker compose -f docker-compose.prod.yml logs --tail=50 nginx
          EOF

            exit 1
          fi

          echo "🔍 Secondary Live Probe Check (${TARGET_LIVE_URL}):"
          LIVE_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 10 "${TARGET_LIVE_URL}" || echo "000")
          echo "ℹ️ Live Endpoint HTTP Response: ${LIVE_CODE}"

          echo "=================================================="
          echo "🎉 PRODUCTION DEPLOYMENT COMPLETED SUCCESSFULLY!"
          echo "🚀 Live URL: https://hophuloc.online"
          echo "=================================================="
