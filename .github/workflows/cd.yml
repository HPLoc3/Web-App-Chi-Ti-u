name: "Production Deployment Pipeline"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Continuous Integration (Test -> Typecheck -> Build -> Docker Build)
  # ============================================================================
  ci:
    name: "🧪 CI Validation (Test, Typecheck, Build)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 Install Dependencies"
        run: npm ci

      - name: "🗄️ Generate Prisma Client"
        run: npx prisma generate

      - name: "🧪 Run Unit & Integration Tests"
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-minimum-32-characters-long!
          JWT_REFRESH_SECRET: test-refresh-jwt-secret-key-minimum-32-chars!
          REFRESH_TOKEN_SECRET: test-refresh-jwt-secret-key-minimum-32-chars!
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
          ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
        run: npm test

      - name: "🔍 Run TypeScript Typecheck"
        run: npm run lint

      - name: "🏗️ Run Production Application Build"
        env:
          NODE_ENV: production
          VITE_API_URL: "https://hophuloc.online"
        run: npm run build

      - name: "🐳 Validate Multi-Stage Docker Build"
        run: |
          docker build \
            --build-arg GIT_COMMIT="${{ github.sha }}" \
            -t hophuloc_app_ci_test:${{ github.sha }} .

  # ============================================================================
  # Stage 2: Production Deployment & Verification
  # ============================================================================
  deploy:
    name: "🚀 Deploy to VPS Production"
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🛡️ Validate Required Deployment Secrets"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          echo "=================================================="
          echo "🔒 VALIDATING DEPLOYMENT CREDENTIALS"
          echo "=================================================="
          MISSING=0
          if [ -z "${SSH_HOST}" ]; then
            echo "❌ ERROR: Missing required secret SSH_HOST"
            MISSING=1
          fi
          if [ -z "${SSH_PORT}" ]; then
            echo "❌ ERROR: Missing required secret SSH_PORT"
            MISSING=1
          fi
          if [ -z "${SSH_USER}" ]; then
            echo "❌ ERROR: Missing required secret SSH_USER"
            MISSING=1
          fi
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "❌ ERROR: Missing required secret SSH_PRIVATE_KEY"
            MISSING=1
          fi

          if [ $MISSING -ne 0 ]; then
            echo "❌ FATAL: Deployment cannot proceed without all 4 SSH secrets."
            exit 1
          fi
          echo "✅ All required SSH secrets are present."

      - name: "🔑 Configure SSH Authentication"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          eval "$(ssh-agent -s)"
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null

          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: "🚀 Remote Deploy on VPS via SSH"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -e
          echo "🌐 Connecting to VPS [${SSH_USER}@${SSH_HOST}:${SSH_PORT}]..."

          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "bash -s" << EOF
            set -eo pipefail

            APP_DIR="/var/www/app-chi-tieu"
            COMPOSE_FILE="docker-compose.prod.yml"
            TARGET_SHA="${TARGET_COMMIT}"

            echo "=================================================="
            echo "📂 Step 1: Navigating to \${APP_DIR}..."
            echo "=================================================="
            cd "\${APP_DIR}"

            echo "=================================================="
            echo "📥 Step 2: Fetching origin/main & Hard Reset..."
            echo "=================================================="
            git fetch origin main
            git reset --hard origin/main

            echo "=================================================="
            echo "🔍 Step 3: Verifying VPS Commit SHA..."
            echo "=================================================="
            VPS_SHA=\$(git rev-parse HEAD)
            echo "Expected Commit SHA : \${TARGET_SHA}"
            echo "Actual VPS Commit   : \${VPS_SHA}"

            if [ "\${VPS_SHA}" != "\${TARGET_SHA}" ]; then
              echo "❌ FATAL: VPS commit SHA mismatch! Expected \${TARGET_SHA}, got \${VPS_SHA}"
              exit 1
            fi
            echo "✅ Commit SHA verified on VPS: \${VPS_SHA}"

            echo "=================================================="
            echo "🛡️ Step 4: Validating Production .env Presence..."
            echo "=================================================="
            if [ ! -f .env ]; then
              echo "❌ FATAL: Production .env file not found at \${APP_DIR}/.env!"
              echo "Deployment aborted. .env must be manually configured on VPS."
              exit 1
            fi
            echo "✅ Production .env file is present."

            echo "=================================================="
            echo "🧹 Step 4.5: Pruning Docker Build Cache & Unused Images (pre-build)..."
            echo "=================================================="
            docker system prune -af
            docker builder prune -af
            df -h /

            echo "=================================================="
            echo "🐳 Step 5: Building Production Docker Images..."
            echo "=================================================="
            COMMIT_SHA="\${TARGET_SHA}" docker compose -f "\${COMPOSE_FILE}" build --pull

            echo "=================================================="
            echo "🗄️ Step 6: Executing Prisma Database Migrations..."
            echo "=================================================="
            docker compose -f "\${COMPOSE_FILE}" run --rm app npx prisma migrate deploy

            echo "=================================================="
            echo "🚀 Step 7: Launching Docker Containers..."
            echo "=================================================="
            COMMIT_SHA="\${TARGET_SHA}" docker compose -f "\${COMPOSE_FILE}" up -d --remove-orphans

            echo "=================================================="
            echo "🧹 Step 8: Pruning Old Docker Images..."
            echo "=================================================="
            docker image prune -f

            echo "=================================================="
            echo "📊 Step 9: Verifying Container Status..."
            echo "=================================================="
            docker compose -f "\${COMPOSE_FILE}" ps
          EOF

      - name: "🩺 Step 10: Verify Production Health Check & Readiness Probe"
        run: |
          set -e

          TARGET_READY_URL="https://hophuloc.online/health/ready"
          TARGET_LIVE_URL="https://hophuloc.online/health/live"

          echo "=================================================="
          echo "🩺 PROBING PRODUCTION READINESS & HEALTH"
          echo "=================================================="
          echo "Ready URL: ${TARGET_READY_URL}"
          echo "Live URL : ${TARGET_LIVE_URL}"
          echo "=================================================="

          MAX_RETRIES=15
          DELAY_SECONDS=5

          check_health() {
            local URL="$1"
            local NAME="$2"

            for ((i=1; i<=MAX_RETRIES; i++)); do
              HTTP_CODE=$(curl -sS -k -o /dev/null -w "%{http_code}" \
                --max-time 10 \
                "${URL}" || echo "000")

              echo "⏳ [${NAME}] Attempt ${i}/${MAX_RETRIES} -> HTTP ${HTTP_CODE}"

              if [ "${HTTP_CODE}" = "200" ]; then
                echo "✅ ${NAME} health check PASSED!"
                return 0
              fi

              if [ "${i}" -lt "${MAX_RETRIES}" ]; then
                sleep "${DELAY_SECONDS}"
              fi
            done

            echo "❌ CRITICAL: ${NAME} health check FAILED!"
            echo "URL: ${URL}"
            exit 1
          }

          check_health "${TARGET_LIVE_URL}" "LIVENESS"
          check_health "${TARGET_READY_URL}" "READINESS"

          echo "=================================================="
          echo "✅ PRODUCTION HEALTH CHECK PASSED"
          echo "=================================================="

      - name: "🔍 Step 11: Verify Production Commit SHA via HTTP"
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -e
          TARGET_VERSION_URL="https://hophuloc.online/health/version"
          TARGET_HEALTH_URL="https://hophuloc.online/health"

          echo "=================================================="
          echo "🔍 VERIFYING LIVE PRODUCTION COMMIT SHA"
          echo "Expected Target SHA: ${TARGET_COMMIT}"
          echo "=================================================="

          VERSION_RESPONSE=$(curl -s -f -k --max-time 10 "${TARGET_VERSION_URL}" || curl -s -f -k --max-time 10 "${TARGET_HEALTH_URL}")
          echo "Live Health Response: ${VERSION_RESPONSE}"

          PROD_COMMIT=$(echo "${VERSION_RESPONSE}" | grep -o '"commit":"[^"]*' | cut -d'"' -f4)
          echo "Reported Live Commit: ${PROD_COMMIT}"

          TARGET_SHORT="${TARGET_COMMIT:0:7}"
          echo "Comparing Expected [${TARGET_SHORT}] with Live [${PROD_COMMIT}]..."

          if [[ "${PROD_COMMIT}" != *"${TARGET_SHORT}"* ]] && [[ "${TARGET_COMMIT}" != *"${PROD_COMMIT}"* ]] && [ "${PROD_COMMIT}" != "unknown" ]; then
            echo "❌ CRITICAL: Live production version mismatch! Expected ${TARGET_COMMIT}, but live server reported ${PROD_COMMIT}."
            exit 1
          fi

          echo "=================================================="
          echo "🎉 ALL PRODUCTION VERIFICATION STEPS PASSED!"
          echo "🚀 Verified Live Commit : ${PROD_COMMIT}"
          echo "🌐 Verified Live URL    : https://hophuloc.online"
          echo "=================================================="

