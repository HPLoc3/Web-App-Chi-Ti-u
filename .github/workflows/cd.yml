name: "Production Deployment Pipeline"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Continuous Integration (Test -> Typecheck -> Build)
  # ============================================================================
  ci:
    name: "🧪 CI Validation (Test, Typecheck, Build)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Step 1: Checkout Source Code"
        uses: actions/checkout@v4

      - name: "⚙️ Step 2: Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 Step 3: Install Dependencies"
        run: npm ci

      - name: "🗄️ Step 4: Generate Prisma Client"
        run: npx prisma generate

      - name: "🧪 Step 5: Run Unit & Integration Tests"
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-minimum-32-characters-long!
          JWT_REFRESH_SECRET: test-refresh-jwt-secret-key-minimum-32-chars!
          REFRESH_TOKEN_SECRET: test-refresh-jwt-secret-key-minimum-32-chars!
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db?schema=public"
          ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
        run: npm test

      - name: "🔍 Step 6: Run TypeScript Typecheck"
        run: npm run lint

      - name: "🏗️ Step 7: Run Production Application Build"
        env:
          NODE_ENV: production
          VITE_API_URL: "https://hophuloc.online"
          COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build

  # ============================================================================
  # Stage 2: Production Deployment & Verification (PM2 Host + Docker PostgreSQL)
  # ============================================================================
  deploy:
    name: "🚀 Deploy to VPS Production"
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Step 1: Checkout Source Code"
        uses: actions/checkout@v4

      - name: "🛡️ Step 2: Validate Required Deployment Secrets"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          echo "=================================================="
          echo "🔒 VALIDATING DEPLOYMENT CREDENTIALS"
          echo "=================================================="
          MISSING=0
          if [ -z "${SSH_HOST}" ]; then
            echo "❌ ERROR: Missing required secret SSH_HOST"
            MISSING=1
          fi
          if [ -z "${SSH_PORT}" ]; then
            echo "❌ ERROR: Missing required secret SSH_PORT"
            MISSING=1
          fi
          if [ -z "${SSH_USER}" ]; then
            echo "❌ ERROR: Missing required secret SSH_USER"
            MISSING=1
          fi
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "❌ ERROR: Missing required secret SSH_PRIVATE_KEY"
            MISSING=1
          fi

          if [ $MISSING -ne 0 ]; then
            echo "❌ FATAL: Deployment cannot proceed without all 4 SSH secrets."
            exit 1
          fi
          echo "✅ All required SSH secrets are present."

      - name: "🔑 Step 3: Configure SSH Authentication"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          eval "$(ssh-agent -s)"
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add - > /dev/null

          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: "🚀 Step 4-10: Remote Deploy on VPS via SSH"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -e
          echo "🌐 Connecting to VPS [${SSH_USER}@${SSH_HOST}:${SSH_PORT}]..."

          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new "${SSH_USER}@${SSH_HOST}" "bash -s -- '${TARGET_COMMIT}'" << 'EOF'
          set -eo pipefail

          APP_DIR="/var/www/app-chi-tieu"
          TARGET_SHA="$1"

          echo "=================================================="
          echo "📂 Step 1: Navigating to ${APP_DIR} & Loading NVM..."
          echo "=================================================="
          cd "${APP_DIR}"

          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"

          if [ ! -s "${NVM_DIR}/nvm.sh" ]; then
            echo "❌ FATAL: NVM not found at ${NVM_DIR}/nvm.sh"
            exit 1
          fi

          . "${NVM_DIR}/nvm.sh"

          if ! command -v nvm >/dev/null 2>&1; then
            echo "❌ FATAL: nvm command unavailable"
            exit 1
          fi

          nvm use default

          echo "Verifying Node.js, npm, npx, and pm2 binaries..."
          command -v node >/dev/null 2>&1 || { echo "❌ FATAL: node command not found"; exit 1; }
          command -v npm >/dev/null 2>&1 || { echo "❌ FATAL: npm command not found"; exit 1; }
          command -v npx >/dev/null 2>&1 || { echo "❌ FATAL: npx command not found"; exit 1; }
          command -v pm2 >/dev/null 2>&1 || { echo "❌ FATAL: pm2 command not found on VPS"; exit 1; }

          echo "Node version: $(node --version)"
          echo "NPM version : $(npm --version)"
          echo "NPX version : $(npx --version)"
          echo "PM2 path    : $(command -v pm2)"

          echo "=================================================="
          echo "📥 Step 2: Fetching origin/main & Resetting..."
          echo "=================================================="
          git fetch origin main
          git reset --hard origin/main

          VPS_SHA=$(git rev-parse HEAD)
          echo "Expected Commit SHA : ${TARGET_SHA}"
          echo "Actual VPS Commit   : ${VPS_SHA}"

          if [ "${VPS_SHA}" != "${TARGET_SHA}" ]; then
            echo "❌ FATAL: VPS commit SHA mismatch! Expected ${TARGET_SHA}, got ${VPS_SHA}"
            exit 1
          fi
          echo "✅ Verified commit SHA on VPS: ${VPS_SHA}"

          echo "=================================================="
          echo "🛡️ Step 3: Verifying Production .env..."
          echo "=================================================="
          if [ ! -f .env ]; then
            echo "❌ FATAL: Production .env file not found at ${APP_DIR}/.env!"
            echo "Deployment aborted. .env must be maintained on VPS."
            exit 1
          fi
          echo "✅ Production .env exists."

          echo "=================================================="
          echo "💾 Step 3.5: Checking Disk Space..."
          echo "=================================================="
          df -h /
          AVAILABLE_KB=$(df -k / | awk 'NR==2 {print $4}')
          MIN_REQUIRED_KB=2097152 # 2 GB in KB
          if [ "${AVAILABLE_KB}" -lt "${MIN_REQUIRED_KB}" ]; then
            echo "❌ FATAL: Available disk space is below 2GB (${AVAILABLE_KB} KB available)!"
            exit 1
          fi
          echo "✅ Disk space is sufficient (> 2GB available)."

          echo "=================================================="
          echo "🐘 Step 4: Ensuring PostgreSQL Container is Healthy..."
          echo "=================================================="
          docker compose -f docker-compose.prod.yml up -d postgres

          PG_READY=0
          for i in {1..15}; do
            if docker exec hophuloc_postgres_prod pg_isready -U postgres -d hophuloc_expense_db > /dev/null 2>&1; then
              PG_READY=1
              echo "✅ PostgreSQL database container is healthy and accepting connections."
              break
            fi
            echo "⏳ Waiting for PostgreSQL container to become ready (${i}/15)..."
            sleep 2
          done

          if [ "${PG_READY}" -ne 1 ]; then
            echo "❌ FATAL: PostgreSQL container failed health check!"
            docker compose -f docker-compose.prod.yml ps postgres
            exit 1
          fi

          echo "=================================================="
          echo "📦 Step 5: Checking Registry & Installing Dependencies with npm ci..."
          echo "=================================================="
          CURRENT_REGISTRY=$(npm config get registry)
          echo "NPM Registry: ${CURRENT_REGISTRY}"

          npm ci \
            --fetch-retries=5 \
            --fetch-retry-factor=2 \
            --fetch-retry-mintimeout=2000 \
            --fetch-retry-maxtimeout=30000

          echo "=================================================="
          echo "🗄️ Step 6: Generating Prisma Client..."
          echo "=================================================="
          npx prisma generate

          echo "=================================================="
          echo "🏗️ Step 7: Build before PM2 reload..."
          echo "=================================================="
          export COMMIT_SHA="${TARGET_SHA}"
          export GIT_COMMIT="${TARGET_SHA}"
          npm run build

          echo "=================================================="
          echo "🚀 Step 8: Executing Prisma Database Migrations..."
          echo "=================================================="
          # NOTE: Production migrations must be backward compatible with the currently running application.
          npx prisma migrate deploy

          echo "=================================================="
          echo "⚡ Step 9: Reloading Application via PM2..."
          echo "=================================================="
          export COMMIT_SHA="${TARGET_SHA}"
          export GIT_COMMIT="${TARGET_SHA}"
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save

          echo "=================================================="
          echo "📊 Step 10: Verifying PM2 Status & Local Health Gate..."
          echo "=================================================="
          pm2 status

          sleep 3

          echo "Testing local liveness (http://127.0.0.1:3000/health/live)..."
          curl -fsS http://127.0.0.1:3000/health/live
          echo ""

          echo "Testing local readiness (http://127.0.0.1:3000/health/ready)..."
          curl -fsS http://127.0.0.1:3000/health/ready
          echo ""

          echo "Testing local version (http://127.0.0.1:3000/health/version)..."
          LOCAL_VERSION_JSON=$(curl -fsS http://127.0.0.1:3000/health/version)
          echo "Local version response: ${LOCAL_VERSION_JSON}"

          LOCAL_COMMIT=$(node -e 'try { const data = JSON.parse(process.argv[1]); console.log(data.commit || ""); } catch { console.log(""); }' "${LOCAL_VERSION_JSON}")
          echo "Local reported commit: ${LOCAL_COMMIT}"

          if [ -z "${LOCAL_COMMIT}" ] || [ "${LOCAL_COMMIT}" = "unknown" ]; then
            echo "❌ FATAL: Local /health/version returned invalid or unknown commit SHA: '${LOCAL_COMMIT}'"
            exit 1
          fi

          TARGET_SHORT="${TARGET_SHA:0:7}"
          if [ "${LOCAL_COMMIT}" != "${TARGET_SHA}" ] && [ "${LOCAL_COMMIT}" != "${TARGET_SHORT}" ]; then
            echo "❌ FATAL: Local commit SHA mismatch! Expected ${TARGET_SHA} (${TARGET_SHORT}), got ${LOCAL_COMMIT}"
            exit 1
          fi

          echo "✅ Local PM2 health, readiness, and version checks passed with exact commit match."
          EOF

      - name: "🩺 Step 11: Verify External Production Health & Readiness"
        run: |
          set -e

          TARGET_LIVE_URL="https://hophuloc.online/health/live"
          TARGET_READY_URL="https://hophuloc.online/health/ready"

          echo "=================================================="
          echo "🩺 PROBING EXTERNAL PRODUCTION HEALTH"
          echo "Live URL : ${TARGET_LIVE_URL}"
          echo "Ready URL: ${TARGET_READY_URL}"
          echo "=================================================="

          MAX_RETRIES=15
          DELAY_SECONDS=5

          check_endpoint() {
            local URL="$1"
            local NAME="$2"

            for ((i=1; i<=MAX_RETRIES; i++)); do
              HTTP_CODE=$(curl -sS -k -o /dev/null -w "%{http_code}" \
                --max-time 10 \
                "${URL}" || echo "000")

              echo "⏳ [${NAME}] Attempt ${i}/${MAX_RETRIES} -> HTTP ${HTTP_CODE}"

              if [ "${HTTP_CODE}" = "200" ]; then
                echo "✅ ${NAME} probe PASSED (HTTP 200)!"
                return 0
              fi

              if [ "${i}" -lt "${MAX_RETRIES}" ]; then
                sleep "${DELAY_SECONDS}"
              fi
            done

            echo "❌ CRITICAL: ${NAME} probe FAILED after ${MAX_RETRIES} attempts!"
            echo "URL: ${URL}"
            exit 1
          }

          check_endpoint "${TARGET_LIVE_URL}" "LIVENESS"
          check_endpoint "${TARGET_READY_URL}" "READINESS"

          echo "=================================================="
          echo "✅ EXTERNAL PRODUCTION HEALTH CHECKS PASSED"
          echo "=================================================="

      - name: "🔍 Step 12: Verify Live Production Commit SHA"
        env:
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -e
          TARGET_VERSION_URL="https://hophuloc.online/health/version"

          echo "=================================================="
          echo "🔍 VERIFYING LIVE PRODUCTION COMMIT SHA"
          echo "Expected Target SHA: ${TARGET_COMMIT}"
          echo "Version URL        : ${TARGET_VERSION_URL}"
          echo "=================================================="

          VERSION_RESPONSE=$(curl -sS -f -k --max-time 10 "${TARGET_VERSION_URL}")
          echo "Live Version Response: ${VERSION_RESPONSE}"

          PROD_COMMIT=$(echo "${VERSION_RESPONSE}" | jq -r '.commit // empty')
          echo "Reported Live Commit: ${PROD_COMMIT}"

          if [ -z "${PROD_COMMIT}" ] || [ "${PROD_COMMIT}" = "unknown" ]; then
            echo "❌ CRITICAL: Live production reported invalid or 'unknown' commit SHA: '${PROD_COMMIT}'"
            exit 1
          fi

          TARGET_SHORT="${TARGET_COMMIT:0:7}"
          echo "Validating Commit Match (Expected: ${TARGET_COMMIT} / ${TARGET_SHORT} vs Reported: ${PROD_COMMIT})..."

          if [ "${PROD_COMMIT}" = "${TARGET_COMMIT}" ]; then
            echo "✅ Exact 40-char commit SHA match confirmed!"
          elif [ "${PROD_COMMIT}" = "${TARGET_SHORT}" ]; then
            echo "✅ Exact 7-char short commit SHA match confirmed!"
          elif [ "${#PROD_COMMIT}" -ge 7 ] && [[ "${TARGET_COMMIT}" == "${PROD_COMMIT}"* ]]; then
            echo "✅ Exact prefix commit SHA (${PROD_COMMIT}) match confirmed against full commit (${TARGET_COMMIT})!"
          else
            echo "❌ CRITICAL: Live production version mismatch! Expected ${TARGET_COMMIT}, but live server returned ${PROD_COMMIT}."
            exit 1
          fi

          echo "=================================================="
          echo "🎉 ALL PRODUCTION VERIFICATION STEPS PASSED!"
          echo "🚀 Verified Live Commit : ${PROD_COMMIT}"
          echo "🌐 Verified Live Domain : https://hophuloc.online"
          echo "=================================================="
