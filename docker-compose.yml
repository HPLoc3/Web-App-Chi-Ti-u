version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hophuloc_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hophuloc_admin
      POSTGRES_PASSWORD: SecurePass_157_66_101_43
      POSTGRES_DB: hophuloc_expense_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hophuloc_admin -d hophuloc_expense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
