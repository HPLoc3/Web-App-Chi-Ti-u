version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hophuloc_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be defined in local .env}
      POSTGRES_DB: ${POSTGRES_DB:-hophuloc_expense_db}
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: hophuloc_postgres_data
    driver: local
